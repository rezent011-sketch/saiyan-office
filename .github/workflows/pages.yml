name: pages
on:
  push:
    branches:
      - gh-pages
      - cursor/grok-cursor-office-board-6913
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build office when sources are present
        run: |
          if [ -f scripts/build_pages.sh ]; then
            bash scripts/build_pages.sh
            echo "PAGES_PATH=_site" >> "$GITHUB_ENV"
          else
            echo "PAGES_PATH=." >> "$GITHUB_ENV"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}
      - id: deployment
        uses: actions/deploy-pages@v4
